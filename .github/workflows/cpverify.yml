name: cpverify
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python3 cp_verify.py cp4.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cpverify, path: cp4.txt, if-no-files-found: warn}
