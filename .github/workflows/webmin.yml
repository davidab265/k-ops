name: webmin
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: fingerprint + legacy CVE
        run: python3 pwn_webmin.py webmin_hosts.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webmin-results
          path: /tmp/webmin_result.json
          if-no-files-found: warn
