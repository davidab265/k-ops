name: strict2
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - run: python3 strict_llm.py other_llm.txt strict2_out.json | tail -100 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: strict2, path: strict2_out.json}
