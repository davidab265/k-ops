name: wmssh2
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - name: key
        run: |
          echo "$KOPS_KEY" > /tmp/kops_key && chmod 600 /tmp/kops_key
          ssh-keygen -y -f /tmp/kops_key > /tmp/kops_key.pub && chmod 644 /tmp/kops_key.pub
        env: {KOPS_KEY: "${{ secrets.KOPS_KEY }}"}
      - name: install via filemin cron.d
        run: python3 wm_ssh.py new_wm.txt || true
      - name: wait for cron
        run: sleep 100
      - name: ssh
        run: |
          for h in 134.209.192.147; do
            echo "=== $h ==="
            ssh -i /tmp/kops_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o BatchMode=yes root@$h 'id; hostname; uname -r' 2>&1 | head -3
          done
