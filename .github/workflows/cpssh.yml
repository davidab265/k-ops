name: cpssh
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python3 cp_ssh.py cp4.txt || true
      - run: sleep 10
      - run: |
          mkdir -p ~/.ssh && echo "$KOPS_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          for h in 146.190.200.5 139.84.238.2 172.233.204.200 45.79.193.17; do
            echo "=== $h ==="
            ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o BatchMode=yes root@$h 'id; hostname' 2>&1 | head -3
          done
        env:
          KOPS_KEY: ${{ secrets.KOPS_KEY }}
